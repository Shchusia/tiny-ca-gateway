[project]
name = "tiny-ca-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [

    "gunicorn>=26.0.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "tiny-ca[async]>=0.2.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.136.1",
]
django = [
    "django>=6.0.5",
    "django-ninja>=1.6.2",
]
flask = [
    "flask>=3.1.3",
]
aiohttp = [
    "aiohttp>=3.13.5",
]
all = [
    "tiny-ca[fastapi,django,flask,aiohttp]",
]

[dependency-groups]
demo = [
    "aiohttp>=3.13.5",
    "django>=6.0.5",
    "fastapi>=0.136.1",
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "uvicorn>=0.46.0",
]
lint = [
    "bandit>=1.9.4",
    "black>=26.3.0",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
]


[tool.uv.build-backend]
source-include = ["LICENSE"]

[tool.setuptools.packages.find]
exclude = ["certs*", "tests*", "examples*"]


[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",
    "B008",
    "F401",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["your_package"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]
"test_*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


# ──────────────────────────────────────────────
# Mypy
# ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_calls = true
show_error_codes = true
show_column_numbers = true
pretty = true
warn_unreachable = true
warn_return_any = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
check_untyped_defs = true
no_strict_optional = true
warn_unused_ignores = false
disallow_subclassing_any = false
disallow_untyped_defs = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
exclude = "migrations/"
disable_error_code = ["untyped-decorator"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "*"
disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true


[tool.bandit.assert_used]
exclude_dirs = ["venv", "tests"]
exclude = ["/tests", "/venv"]
nosec = ["B608"]
skips = ["*/*_test.py", "*/test_*.py", "*/grafana.py", "B608"]

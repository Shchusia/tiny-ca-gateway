# ──────────────────────────────────────────────
# Build system
# ──────────────────────────────────────────────
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tiny_ca_gateway*"]
exclude = ["certs*", "tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
"tiny_ca_gateway" = ["py.typed"]

[tool.uv.build-backend]
source-include = ["LICENSE", "README.md"]

# ──────────────────────────────────────────────
# Project metadata
# ──────────────────────────────────────────────
[project]
name = "tiny-ca-gateway"
version = "0.1.0"
description = "Framework-agnostic REST API routes for tiny-ca — supports FastAPI, Flask, aiohttp and Django Ninja"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Denis Shchutskyi", email = "denisshchutskyi@gmail.com" }
]
keywords = [
    "certificate-authority",
    "pki",
    "ca",
    "tls",
    "ssl",
    "fastapi",
    "flask",
    "aiohttp",
    "django",
    "rest",
    "api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Framework :: Django",
    "Typing :: Typed",
]
dependencies = [
    "gunicorn>=26.0.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "tiny-ca[async]>=0.2.0",
    "aiofiles>=23.0.0",
    "cryptography>=42.0.0",
]

[project.urls]
Homepage = "https://github.com/Shchusia/tiny-ca-gateway"
Documentation = "https://github.com/Shchusia/tiny-ca-gateway#readme"
"Bug Tracker" = "https://github.com/Shchusia/tiny-ca-gateway/issues"
Changelog = "https://github.com/Shchusia/tiny-ca-gateway/blob/master/CHANGELOG.md"

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.29.0",
]
django = [
    "django>=6.0.5",
    "django-ninja>=1.6.2",
]
flask = [
    "flask>=3.1.3",
]
aiohttp = [
    "aiohttp>=3.13.5",
]
all = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.29.0",
    "django>=6.0.5",
    "django-ninja>=1.6.2",
    "flask>=3.1.3",
    "aiohttp>=3.13.5",
]

[dependency-groups]
demo = [
    "aiohttp>=3.13.5",
    "django>=6.0.5",
    "fastapi>=0.136.1",
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "uvicorn>=0.46.0",
]
lint = [
    "bandit>=1.9.4",
    "black>=26.3.0",
    "mypy>=1.19.1",
    "pip-audit>=2.10.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.5",
]

# ──────────────────────────────────────────────
# Black
# ──────────────────────────────────────────────
[tool.black]
line-length = 88
target-version = ["py311", "py312"]

# ──────────────────────────────────────────────
# Ruff
# ──────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "F401"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["tiny_ca_gateway"]
force-sort-within-sections = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004"]
"test_*.py" = ["S101", "PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ──────────────────────────────────────────────
# Mypy
# ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_calls = true
show_error_codes = true
show_column_numbers = true
pretty = true
warn_unreachable = true
warn_return_any = true
disallow_incomplete_defs = true
no_implicit_optional = true
strict_equality = true
ignore_missing_imports = true
check_untyped_defs = true
no_strict_optional = true
warn_unused_ignores = false
disallow_subclassing_any = false
disallow_untyped_defs = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
exclude = "migrations/"
disable_error_code = ["untyped-decorator"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = "*"
disallow_untyped_calls = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

# ──────────────────────────────────────────────
# Bandit
# ──────────────────────────────────────────────
[tool.bandit.assert_used]
exclude_dirs = ["venv", "tests"]
exclude = ["/tests", "/venv"]
nosec = ["B608"]
skips = ["*/*_test.py", "*/test_*.py", "B608"]

